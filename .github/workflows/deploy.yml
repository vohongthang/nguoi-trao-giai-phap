name: Deploy GitHub Pages

# Tu dong build & deploy len GitHub Pages moi khi co commit moi len nhanh main.
#
# LUU Y QUAN TRONG: workflow nay dung nguon deploy "GitHub Actions". De no thuc su chay,
# vao Settings > Pages > Build and deployment > Source, chon "GitHub Actions" (repo hien
# dang de "Deploy from a branch" nen van tu deploy qua co che Pages mac dinh cua GitHub -
# viec do van tiep tuc hoat dong binh thuong cho toi khi ban chuyen Source sang "GitHub Actions").

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
